[project]
name = "project-dash"
version = "2.0.1"
description = "Project Monaro Risk Governance & Intelligence Platform"
authors = [
    { name = "Brendan Hills", email = "brendanhills@google.com" }
]
dependencies = []
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"

