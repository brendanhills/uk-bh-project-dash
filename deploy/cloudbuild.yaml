steps:
  # 1. Run Automated Unit & Ingestion Tests
  - name: 'python:3.13-slim'
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest

  # 2. Ensure Artifact Registry repository exists in Australia region
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe cloud-run-source-deploy --location=${_REGION} --project=$PROJECT_ID || \
        gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=${_REGION} --description="Cloud Run source deployments" --project=$PROJECT_ID

  # 3. Inject dynamic build metadata into data/build_info.json for dashboard footer
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BUILD_TAG="$TAG_NAME"
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="$BRANCH_NAME"
        fi
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="dev"
        fi
        BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
        cat << BUILD_JSON > data/build_info.json
        {
          "tag": "$$BUILD_TAG",
          "commit": "$COMMIT_SHA",
          "region": "${_REGION}",
          "timestamp": "$$BUILD_TIME",
          "service": "${_SERVICE_NAME}"
        }
        BUILD_JSON
        echo "=== Generated data/build_info.json ==="
        cat data/build_info.json

  # 4. Build container image using custom Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'project_dash'
    args:
      - 'build'
      - '-f'
      - 'deploy/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
      - '.'

  # 5. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'

  # 6. Deploy to Cloud Run (Private Mode + Native IAP Enabled in Australia)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--port'
      - '8080'
      - '--update-labels'
      - 'commit-sha=$SHORT_SHA,gcb-build-id=$BUILD_ID'
      - '--set-env-vars'
      - 'COMMIT_SHA=$COMMIT_SHA,BUILD_ID=$BUILD_ID,REGION=${_REGION}'

  # 7. Enforce IAM Invoker and IAP Group Policies via CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Grant Cloud Run Invoker to IAP Service Agent
        PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format="value(projectNumber)" 2>/dev/null || true)
        if [ -n "$$PROJECT_NUMBER" ]; then
          gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
            --project=$PROJECT_ID \
            --region=${_REGION} \
            --member="serviceAccount:service-$$PROJECT_NUMBER@gcp-sa-iap.iam.gserviceaccount.com" \
            --role="roles/run.invoker" || true
        fi

        TWOSYNC_GROUP=$(echo "${_ACCESS_GROUP}" | sed 's/@google.com/@twosync.google.com/')

        # 2. Grant Cloud Run Invoker to Environment Google Group and Designated Leads
        for GRP in "${_ACCESS_GROUP}" "$$TWOSYNC_GROUP"; do
          gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
            --project=$PROJECT_ID \
            --region=${_REGION} \
            --member="group:$$GRP" \
            --role="roles/run.invoker" || true
        done

        for USR in "brendanhills@google.com" "allins@google.com"; do
          gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
            --project=$PROJECT_ID \
            --region=${_REGION} \
            --member="user:$$USR" \
            --role="roles/run.invoker" || true
        done

        # 3. Grant IAP-secured Web App User role to Google Group and Designated Leads
        for GRP in "${_ACCESS_GROUP}" "$$TWOSYNC_GROUP"; do
          gcloud beta iap web add-iam-policy-binding \
            --project=$PROJECT_ID \
            --resource-type="cloud-run" \
            --service="${_SERVICE_NAME}" \
            --region="${_REGION}" \
            --member="group:$$GRP" \
            --role="roles/iap.httpsResourceAccessor" || true
        done

        for USR in "brendanhills@google.com" "allins@google.com"; do
          gcloud beta iap web add-iam-policy-binding \
            --project=$PROJECT_ID \
            --resource-type="cloud-run" \
            --service="${_SERVICE_NAME}" \
            --region="${_REGION}" \
            --member="user:$$USR" \
            --role="roles/iap.httpsResourceAccessor" || true
        done

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'monaro-risk-dash-dev'
  _IMAGE_NAME: 'monaro-risk-dash-dev'
  _ACCESS_GROUP: 'monaro-risk-dev@google.com'
  _REGION: 'australia-southeast1'

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
