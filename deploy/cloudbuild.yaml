steps:
  # 1. Run Automated Unit & Ingestion Tests
  - name: 'python:3.13-slim'
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        python3 -m unittest discover -s tests -p "test_*.py"

  # 2. Ensure Artifact Registry repository exists in Australia region
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe cloud-run-source-deploy --location=${_REGION} --project=$PROJECT_ID || \
        gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=${_REGION} --description="Cloud Run source deployments" --project=$PROJECT_ID

  # 3. Build container image using custom Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'project_dash'
    args:
      - 'build'
      - '-f'
      - 'deploy/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
      - '.'

  # 4. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'

  # 5. Deploy to Cloud Run (Private Mode + Native IAP Enabled in Australia)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--port'
      - '8080'

  # 6. Enforce IAM Invoker and IAP Group Policies via CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Grant Cloud Run Invoker to IAP Service Agent
        gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --member="serviceAccount:service-$PROJECT_NUMBER@gcp-sa-iap.iam.gserviceaccount.com" \
          --role="roles/run.invoker" || true

        # 2. Grant Cloud Run Invoker to Environment Google Group and Designated Leads
        gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --member="group:${_ACCESS_GROUP}" \
          --role="roles/run.invoker" || true

        gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --member="user:brendanhills@google.com" \
          --role="roles/run.invoker" || true

        gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --member="user:allins@google.com" \
          --role="roles/run.invoker" || true

        # 3. Grant IAP-secured Web App User role to Google Group and Designated Leads
        gcloud beta iap web add-iam-policy-binding \
          --project=$PROJECT_ID \
          --resource-type="cloud-run" \
          --service="${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --member="group:${_ACCESS_GROUP}" \
          --role="roles/iap.httpsResourceAccessor" || true

        gcloud beta iap web add-iam-policy-binding \
          --project=$PROJECT_ID \
          --resource-type="cloud-run" \
          --service="${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --member="user:brendanhills@google.com" \
          --role="roles/iap.httpsResourceAccessor" || true

        gcloud beta iap web add-iam-policy-binding \
          --project=$PROJECT_ID \
          --resource-type="cloud-run" \
          --service="${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --member="user:allins@google.com" \
          --role="roles/iap.httpsResourceAccessor" || true

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'monaro-risk-dash-dev'
  _IMAGE_NAME: 'monaro-risk-dash-dev'
  _ACCESS_GROUP: 'monaro-risk-dev@google.com'
  _REGION: 'australia-southeast1'

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
