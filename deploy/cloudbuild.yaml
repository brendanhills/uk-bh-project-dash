steps:
  # 1. Inject dynamic build metadata into data/build_info.json for dashboard footer
  # Uses python:3.13-slim; runs concurrently with cache pull at t=0
  - name: 'python:3.13-slim'
    id: 'build-info'
    waitFor: ['-']
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BUILD_TAG="$TAG_NAME"
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="$BRANCH_NAME"
        fi
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="dev"
        fi
        BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
        cat << BUILD_JSON > data/build_info.json
        {
          "tag": "$$BUILD_TAG",
          "commit": "$COMMIT_SHA",
          "region": "${_REGION}",
          "timestamp": "$$BUILD_TIME",
          "service": "${_SERVICE_NAME}"
        }
        BUILD_JSON
        echo "=== Generated data/build_info.json ==="
        cat data/build_info.json

  # 2. Pull previous image for Docker layer caching (non-blocking, starts at t=0)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest || true

  # 3. Build Unified Container Image with Docker layer caching and BuildKit
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    waitFor: ['build-info', 'pull-cache']
    dir: 'project_dash'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
      - '-f'
      - 'deploy/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
      - '.'

  # 4. Run Automated Unit & Ingestion Tests inside the built container (zero pip install overhead!)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'run-tests'
    waitFor: ['build-image']
    args:
      - 'run'
      - '--rm'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - 'pytest'

  # 5. Push container image to Artifact Registry (runs only after unit tests pass)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    waitFor: ['run-tests']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}'

  # 6. Deploy Web Service to Cloud Run (Private Mode + IAP + GCS Volume Mount)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-web'
    waitFor: ['push-image']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--port'
      - '8080'
      - '--execution-environment'
      - 'gen2'
      - '--add-volume'
      - 'name=data-volume,type=cloud-storage,bucket=$PROJECT_ID-data'
      - '--add-volume-mount'
      - 'volume=data-volume,mount-path=/app/data'
      - '--update-labels'
      - 'commit-sha=$SHORT_SHA,gcb-build-id=$BUILD_ID'
      - '--set-env-vars'
      - 'COMMIT_SHA=$COMMIT_SHA,BUILD_ID=$BUILD_ID,REGION=${_REGION},DEFAULT_PROJECTS=monaro,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_REGION=${_GEMINI_REGION}'

  # 7. Update Ingestion Sync Job in Cloud Run (runs concurrently with deploy-web!)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'update-job'
    waitFor: ['push-image']
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'monaro-risk-sync-job'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--command=python,scripts/sync_drive.py'
      - '--args=--project=monaro'
      - '--region'
      - '${_REGION}'
      - '--execution-environment'
      - 'gen2'
      - '--add-volume'
      - 'name=data-volume,type=cloud-storage,bucket=$PROJECT_ID-data'
      - '--add-volume-mount'
      - 'volume=data-volume,mount-path=/app/data'
      - '--set-env-vars'
      - 'DEFAULT_PROJECTS=monaro,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_REGION=${_GEMINI_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'monaro-risk-dash-dev'
  _IMAGE_NAME: 'monaro-risk-dash-dev'
  _ACCESS_GROUP: 'monaro-risk-dev@google.com'
  _REGION: 'australia-southeast1'
  _GEMINI_MODEL: 'gemini-3.5-flash'
  _GEMINI_REGION: 'us'

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
