steps:
  # 1. Run Automated Unit & Ingestion Tests
  - name: 'python:3.13-slim'
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest

  # 2. Inject dynamic build metadata into data/build_info.json for dashboard footer
  # Reuses cached python:3.13-slim image from step 1 for instant 0-second start
  - name: 'python:3.13-slim'
    dir: 'project_dash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BUILD_TAG="$TAG_NAME"
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="$BRANCH_NAME"
        fi
        if [ -z "$$BUILD_TAG" ]; then
          BUILD_TAG="dev"
        fi
        BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
        cat << BUILD_JSON > data/build_info.json
        {
          "tag": "$$BUILD_TAG",
          "commit": "$COMMIT_SHA",
          "region": "${_REGION}",
          "timestamp": "$$BUILD_TIME",
          "service": "${_SERVICE_NAME}"
        }
        BUILD_JSON
        echo "=== Generated data/build_info.json ==="
        cat data/build_info.json

  # 3. Build Web Dashboard Container Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'project_dash'
    args:
      - 'build'
      - '-f'
      - 'deploy/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
      - '.'

  # 4. Pull previous sync image for Docker layer caching (non-blocking)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:latest || true

  # 5. Build Sync Worker Container Image with Docker layer caching
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'project_dash'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:latest'
      - '-f'
      - 'deploy/Dockerfile.sync'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:latest'
      - '.'

  # 6. Push container images to Artifact Registry concurrently
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync'

  # 7. Deploy Web Service to Cloud Run (Private Mode + IAP + GCS Volume Mount)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--port'
      - '8080'
      - '--execution-environment'
      - 'gen2'
      - '--add-volume'
      - 'name=data-volume,type=cloud-storage,bucket=$PROJECT_ID-data,readonly=true'
      - '--add-volume-mount'
      - 'volume=data-volume,mount-path=/usr/share/nginx/html/data'
      - '--update-labels'
      - 'commit-sha=$SHORT_SHA,gcb-build-id=$BUILD_ID'
      - '--set-env-vars'
      - 'COMMIT_SHA=$COMMIT_SHA,BUILD_ID=$BUILD_ID,REGION=${_REGION}'

  # 8. Update Ingestion Sync Job in Cloud Run (Gen2 + GCS Volume Mount)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'monaro-risk-sync-job'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--execution-environment'
      - 'gen2'
      - '--add-volume'
      - 'name=data-volume,type=cloud-storage,bucket=$PROJECT_ID-data'
      - '--add-volume-mount'
      - 'volume=data-volume,mount-path=/app/data'
      - '--set-env-vars'
      - 'DEFAULT_PROJECTS=monaro,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_REGION=${_GEMINI_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_IMAGE_NAME}:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/monaro-risk-sync:latest'

substitutions:
  _SERVICE_NAME: 'monaro-risk-dash-dev'
  _IMAGE_NAME: 'monaro-risk-dash-dev'
  _ACCESS_GROUP: 'monaro-risk-dev@google.com'
  _REGION: 'australia-southeast1'
  _GEMINI_MODEL: 'gemini-3.5-flash'
  _GEMINI_REGION: 'us'

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
