name: CI - Monaro Risk Dashboard

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: monaro-dash-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests & Contracts
    runs-on: [self-hosted, sh-ubuntu-latest]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: 🧪 Run Automated Pytest Suite
        run: |
          pytest -v
